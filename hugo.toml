baseURL = "http://localhost:1313/"

# Sitio de una sola página estilo app (layouts/index.html). No se generan otras páginas.
disableKinds = ["section", "taxonomy", "term", "RSS", "robotsTXT", "page", "404"]

defaultContentLanguage = "es"

theme = "hugo-scroll"

# Nombre en la pestaña del navegador
title = "FisioRelax · Velas Artesanales"

enableEmoji = true

[params]
    # Imagen que se muestra al compartir el link (WhatsApp, Instagram, etc.)
    images = ["images/compartir.png"]

    # Nombre usado al compartir el sitio
    title = "FisioRelax · Velas Artesanales"

    description = "Velas artesanales de cera de soja, bouquets y regalos personalizados. Envíos a todo Uruguay."

    [params.meta]
        keywords = "velas artesanales, cera de soja, velas aromáticas, bouquets, regalos personalizados, uruguay"

[languages]
  [languages.es]
    weight = 10
    locale = "es-UY"
    label = "Español"

# Hace que las imágenes de static/images también se puedan optimizar (redimensionar a webp)
# desde las plantillas, además de seguir publicándose como archivos estáticos.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
  [[module.mounts]]
    source = "static"
    target = "static"
