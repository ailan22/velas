# Catálogo de la portada (layouts/index.html).
# Para cambiar precios, productos o fotos, editá este archivo.
# Las imágenes se buscan en assets/images o static/images.
# Si un producto, la portada o una tarjeta no tiene "imagen", se muestra una ilustración.

nombre: "FisioRelax"
subtitulo: "Velas & regalos"
# Texto de la franja verde de arriba de todo.
anuncio: "Envíos a todo Uruguay · Hecho a mano con amor"

# Número de WhatsApp con código de país y sin "+" ni espacios.
# PRUEBA: número de test. El de FisioRelax es "59896023275" (volver a ponerlo antes de publicar).
whatsapp_numero: "59894799770"
# Mail para recibir pedidos desde el carrito. Si está vacío, no se muestra el botón "Enviar por mail".
email: ""
instagram: "https://www.instagram.com/fisiorelax_velas/"
facebook: "https://www.facebook.com/profile.php?id=61591755021159"
# tiktok: ""
ubicacion: "Envíos a todo Uruguay 🇺🇾"

# Portada. "imagen": una foto horizontal (ideal 1600x1000) en assets/images.
# O "imagenes": fotos verticales (3:4) para el collage. Se ven de a 3 y van rotando solas;
# cuantas más haya, más variedad. Sin ninguna = ilustración.
hero:
  imagen: ""
  imagenes:
    - "fotos/portada-1.jpg"
    - "fotos/portada-2.jpg"
    - "fotos/portada-3.jpg"
    - "fotos/portada-4.jpg"
    - "fotos/portada-5.jpg"
    - "fotos/portada-6.jpg"
    - "fotos/portada-7.jpg"
    - "fotos/portada-8.jpg"
    - "fotos/portada-9.jpg"
    - "fotos/portada-10.jpg"
    - "fotos/portada-11.jpg"
  titulo: "Pequeños rituales, grandes momentos"
  texto: "Velas artesanales de cera de soja y regalos pensados para regalar calma."
  boton: "Explorar catálogo"
  enlace: "Armar un regalo"

# Sección de contacto.
contacto:
  etiqueta: "Un detalle único"
  titulo: "¿Querés un regalo a medida?"
  texto: "Contanos tu idea y creamos un regalo especial, pensado para sorprender."
  boton: "Armá tu regalo por WhatsApp"

# Las tres tarjetas grandes debajo de la portada. "categoria" es el id de abajo.
destacadas:
  - { titulo: "Decorativas", categoria: decorativas, imagen: "fotos/mascotas.jpg" }
  - { titulo: "Bouquets & flores", categoria: bouquet, imagen: "fotos/cat-bouquets.jpg" }
  - { titulo: "Regalos especiales", categoria: regalo, imagen: "fotos/cat-regalos.jpg" }

categorias:
  - id: frasco
    nombre: "Frascos"
    icono: "🕯️"
  - id: decorativas
    nombre: "Decorativas"
    icono: "🌸"
  - id: bouquet
    nombre: "Bouquets"
    icono: "💐"
  - id: canasta
    nombre: "Canastas"
    icono: "🧺"
  - id: regalo
    nombre: "Regalos"
    icono: "🎁"

# etiqueta: (opcional) texto destacado sobre la foto del producto.
# favorito: true lo muestra en "Favoritos hechos a mano" (ideal: 4 productos).
# imagen: (opcional) foto cuadrada en assets/images.
# precio: número, o vacío para mostrar "Consultar".
# PRUEBA: productos y precios ficticios para probar el carrito. Reemplazar por los reales.
